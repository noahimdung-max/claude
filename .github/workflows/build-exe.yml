name: build-exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    branches: ["claude/bold-darwin-1zygnn"]
    paths: [".github/workflows/build-exe.yml", "minecraft_fishing/ci_test_winapi.py", "minecraft_fishing/winapi.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: minecraft_fishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install mss numpy opencv-python-headless pydirectinput keyboard pillow windows-capture pyinstaller

      - name: Test background-mode Windows APIs
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
        run: python ci_test_winapi.py

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name MinecraftFishingMacro
          --icon icon.ico
          --add-data "fonts;fonts"
          --hidden-import app
          --hidden-import windows_capture
          MacroStart.pyw

      - name: Smoke test (import)
        run: python -c "import app, fishing_macro, common; print('import ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftFishingMacro
          path: minecraft_fishing/dist/MinecraftFishingMacro.exe

      - name: Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '1.0.0' }}
          name: 마크 낚시 매크로 v${{ inputs.version || '1.0.0' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: minecraft_fishing/dist/MinecraftFishingMacro.exe
          body: |
            마인크래프트 낚시 매크로 (Windows 10/11 64비트)

            `MinecraftFishingMacro.exe` 하나만 받아서 실행하면 돼요. 설치 필요 없음.
            설정(config.json, subtitle.png)은 exe 와 같은 폴더에 저장돼요.
            사용법은 저장소 README 참고.
