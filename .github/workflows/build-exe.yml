name: build-exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.0.0)"
        required: true
        default: "1.0.0"
      notes_only:
        description: "빌드 없이 릴리즈 설명만 고치기"
        type: boolean
        default: false
  push:
    branches: ["claude/bold-darwin-1zygnn"]
    paths: [".github/workflows/build-exe.yml", "minecraft_fishing/ci_test_winapi.py", "minecraft_fishing/winapi.py"]

permissions:
  contents: write

jobs:
  notes:
    if: ${{ inputs.notes_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/release_notes.py "${{ inputs.version }}"
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = 'v${{ inputs.version }}';
            const { data: rel } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            await github.rest.repos.updateRelease({ ...context.repo, release_id: rel.id,
              body: fs.readFileSync('notes.md', 'utf8') });
            core.info(`updated ${tag}`);

  build:
    if: ${{ !inputs.notes_only }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: minecraft_fishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install mss numpy opencv-python-headless pydirectinput keyboard pillow windows-capture pyinstaller

      - name: Test background-mode Windows APIs
        timeout-minutes: 3
        env:
          PYTHONIOENCODING: utf-8
        run: python ci_test_winapi.py

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name MinecraftFishingMacro-v${{ inputs.version || 'dev' }}
          --icon icon.ico
          --add-data "fonts;fonts"
          --hidden-import app
          --hidden-import windows_capture
          MacroStart.pyw

      - name: Smoke test (import)
        run: python -c "import app, fishing_macro, common; print('import ok')"

      - name: Smoke test (open window, every page)
        timeout-minutes: 2
        run: python -c "import app; a = app.App(); [a.show_page(k) or a.root.update() for k in a.pages]; a.toggle_theme(); a.root.update(); a.close(); print('ui ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftFishingMacro
          path: minecraft_fishing/dist/*.exe

      - name: Release notes
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: python .github/release_notes.py "${{ inputs.version }}"

      - name: Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '1.0.0' }}
          name: 마크 낚시 매크로 v${{ inputs.version || '1.0.0' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: minecraft_fishing/dist/*.exe
          body_path: notes.md
